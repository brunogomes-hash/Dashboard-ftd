<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Estoque</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0c10; color: #ffffff; padding: 20px; }

    /* Cabeçalho Estoque */
    .header { display: flex; justify-content: space-between; align-items: center; background: #121212; border-radius: 8px; margin-bottom: 20px; border: 1px solid #222; padding: 15px 20px; }
    .header-title { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
    
    .top-kpis { display: flex; gap: 12px; }
    .top-card { background: #1f2833; padding: 10px 18px; border-radius: 6px; text-align: center; border: 1px solid #45a29e; }
    .top-card span { display: block; font-size: 11px; color: #c5c6c7; margin-bottom: 4px; font-weight: bold; }
    .top-card strong { font-size: 20px; color: #ffffff; }

    /* Cards Centrais */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .section-card { background: #121212; border-radius: 8px; padding: 20px; border: 1px solid #2a2a2a; }
    .section-title { display: inline-block; background: #e0e0e0; color: #000; padding: 5px 18px; border-radius: 12px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
    
    .kpi-row { display: flex; justify-content: space-around; text-align: center; background: #1a1a1a; padding: 15px; border-radius: 6px; }
    .kpi-item span { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
    .kpi-item strong { font-size: 22px; color: #fff; }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <div class="header">
    <div class="header-title">ESTOQUE</div>
    <div class="top-kpis">
      <div class="top-card">
        <span>TOTAL ESTOQUE</span>
        <strong id="top-estoque">-</strong>
      </div>
      <div class="top-card">
        <span>TOTAL SKUS</span>
        <strong id="top-skus">-</strong>
      </div>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="grid-container">
    <div class="section-card">
      <div style="text-align: center;"><span class="section-title">Ocupação Picking</span></div>
      <div class="kpi-row">
        <div class="kpi-item"><span>Total Peças</span><strong id="pick-pecas">-</strong></div>
        <div class="kpi-item"><span>Total SKU</span><strong id="pick-sku">-</strong></div>
      </div>
    </div>

    <div class="section-card">
      <div style="text-align: center;"><span class="section-title">Ocupação Pulmão</span></div>
      <div class="kpi-row">
        <div class="kpi-item"><span>Total Peças</span><strong id="pul-pecas">-</strong></div>
        <div class="kpi-item"><span>Total SKU</span><strong id="pul-sku">-</strong></div>
      </div>
    </div>
  </div>

  <script>
    function fmt(num) {
      return Number(num || 0).toLocaleString('pt-BR');
    }

    async function carregarEstoque() {
      try {
        const res = await fetch('/api/estoque');
        const data = await res.json();

        if (data.error) {
          console.error('Erro retornado pela API:', data.detalhe);
          alert('Erro no Banco de Dados: ' + data.detalhe);
          return;
        }

        document.getElementById('top-estoque').innerText = fmt(data.total_estoque);
        document.getElementById('top-skus').innerText = fmt(data.total_skus);

        document.getElementById('pick-pecas').innerText = fmt(data.picking?.pecas);
        document.getElementById('pick-sku').innerText = fmt(data.picking?.sku);

        document.getElementById('pul-pecas').innerText = fmt(data.pulmao?.pecas);
        document.getElementById('pul-sku').innerText = fmt(data.pulmao?.sku);

      } catch (err) {
        console.error('Erro ao carregar Estoque:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', carregarEstoque);
  </script>
</body>
</html>
